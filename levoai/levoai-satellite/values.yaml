replicaCount: 1
resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
affinity: {}
global:
  imageRegistry: ""
  imagePullSecrets: []
  serviceAnnotations: {}
  virtualService:
    enabled: false
    fullyQualifiedDomainName: ""
    gateway: ""
  levoai:
    log_level: INFO
    mode: prod_k8s
    pi_detector_data_dir: "/opt/levoai/datasets/"
  levoai_config_override:
    rabbitmq:
      host: levoai-rabbitmq
      use_ssl: false
      # Max messages buffered per RabbitMQ queue (x-max-length). Applies to every
      # queue (traces, spans, findings, ...). Only used when a queue's type is
      # rabbitmq. NOTE: x-max-length is fixed at queue-declare time -- to resize an
      # already-running deployment you must delete the existing queues (rabbitmqctl
      # delete_queue ...) so they are re-declared, else RabbitMQ returns 406
      # PRECONDITION_FAILED.
      max_queue_size: 100000
    kafka:
      bootstrap_servers: levoai-kafka:9092
    onprem-api:
      # refresh-token: "" # # DEPRECATED: Do not set refresh-token via Helm values.
      #  # Instead, create a Kubernetes Secret (e.g., `levoai-satellite`) with the refresh-token
      #  # and reference it in your configuration.
      org-id: "" # org-id is required -- you must use helm --set global.levoai_config_override.onprem-api.org-id=O where O is a Levo.ai organization ID
      url: "https://api.levo.ai"
    tagger_ignore_seen_flows: true
    authentication_inspection: false # defaults to false. if we want to send over auth secrets, we must use helm --set global.levoai_config_override.authentication_inspection=true
    # By default, satellite will log raw traces at debug level. This can be controlled with the following parameter.
    # WARNING: leave this at debug unless you know what you are doing.
    traces_log_level: DEBUG
    api_rule_evaluation:
      enabled: true
    detection:
      enabled: false
    enable_ssl_cert_checks: true
    ignore_user_agents:
      - "levoai/"
      - "schemathesis/"
      - "kube-probe/"
      - "Prometheus/"
      - "Blackbox Exporter/"
      # Decryption pipeline — uncomment and fill in to enable
      # enable_decryption_pipeline: true
      # decryption_pipeline:
      #   enabled: true
      #   upstreams:
      #     "api.bank.com:443":                          # must match upstreamId above
      #       script_path: /opt/levoai/decrypt/script.py
      #       key_path: /opt/levoai/keys/private.pem
      #       timeout_seconds: 10
      #       decrypt_headers: false
      #       requirements_path: /opt/levoai/decrypt/requirements.txt
  decryptionPipeline:
    enabled: false
    # Host:port that must match the captured traffic's :authority / Host header.
    # NOTE: this value is NOT auto-wired into templates; you must also set the
    # matching key in global.levoai_config_override.decryption_pipeline.upstreams.
    upstreamId: ""
    # Inline Python decryption script (multiline string)
    script: ""
    # pip requirements for the script (multiline string, e.g. "python-jose[cryptography]==3.3.0")
    requirements: ""
    # Pre-existing K8s Secret holding the RSA private key PEM
    existingKeySecret:
      name: ""
      key: "private.pem"
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}
  useRabbitmq: true
  useKafka: false
  busyboxImage: levoai/busybox
  multiTenancyEnabled: false
haproxy:
  enabled: true
  fullnameOverride: "levoai-haproxy"
  image:
    repository: levoai/haproxy
    tag: 0.2.13
  service:
    type: ClusterIP # Change to LoadBalancer to expose it
  satelliteAuthnEnabled: false
rabbitmq:
  fullnameOverride: "levoai-rabbitmq"
  # Override the dependency chart's image if needed
  image:
    registry: "docker.io"
    repository: "rabbitmq"
    tag: "3.13.7-management-alpine"
    pullPolicy: "IfNotPresent"
  persistence:
    enabled: true
    size: 32Gi
  # RabbitMQ container resources -- intentionally UNSET by default to stay
  # backward-compatible on upgrade (existing releases had no chart-level limit;
  # imposing one would newly cap them and risk OOMKilled/earlier blocking under the
  # same traffic). Setting a memory limit is OPT-IN and RECOMMENDED: it adds cgroup
  # OOM protection AND becomes the single source of truth for the memory watermark
  # (exposed via the Downward API as LEVOAI_RABBITMQ_MEM_LIMIT_BYTES and passed to
  # RabbitMQ as total_memory_available_override_value, so the watermark is a fraction
  # of the limit, not host/node RAM). Until you set it, only the disk safeguards and
  # per-queue byte cap apply, and the watermark stays relative to node memory (same
  # as before this change). To enable container-aware memory protection, uncomment:
  #   resources:
  #     limits:
  #       memory: 1Gi      # size per the storage guide; watermark auto-tracks this
  #     requests:
  #       memory: 512Mi
  resources: {}
  # NOTE: extraConfiguration is NOT rendered into rabbitmq.conf here because
  # `configuration:` (below) is overridden to a single line, which replaces the
  # bitnami default template that would otherwise append extraConfiguration. The
  # alarm knobs (disk_free_limit, vm_memory_high_watermark) are therefore applied
  # via -rabbit args in RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS instead (that path is
  # honored by the official image, matching the docker-compose deployment).
  extraConfiguration: |-
    heartbeat = 600
    tcp_listen_options.keepalive = true
    tcp_listen_options.nodelay = true
    tcp_listen_options.send_timeout = 120000
  extraEnvVars:
    # Pod memory limit in bytes (single source of truth = resources.limits.memory
    # above). Consumed by total_memory_available_override_value below and by the
    # postStart hook. Must precede RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS so the k8s
    # $(VAR) reference resolves.
    - name: LEVOAI_RABBITMQ_MEM_LIMIT_BYTES
      valueFrom:
        resourceFieldRef:
          containerName: rabbitmq
          resource: limits.memory
    # Per-queue byte cap installed as a broker policy by the postStart hook.
    - name: LEVOAI_RABBITMQ_MAX_QUEUE_SIZE_BYTES
      value: "4294967296"
    # disk_free_limit (bytes) + vm_memory_high_watermark (fraction of the container
    # limit via the override) size the disk/memory alarms so RabbitMQ blocks
    # publishers predictably instead of filling the PVC or getting OOM-killed.
    - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
      value: "-rabbit consumer_timeout 600000 -rabbit disk_free_limit 536870912 -rabbit vm_memory_high_watermark 0.7 -rabbit total_memory_available_override_value $(LEVOAI_RABBITMQ_MEM_LIMIT_BYTES)"
    - name: RABBITMQ_ENABLED_PLUGINS_FILE
      value: "/bitnami/rabbitmq/mnesia/enabled_plugins"
    - name: RABBITMQ_DEFAULT_USER
      valueFrom:
        secretKeyRef:
          name: levoai-rabbitmq-auth
          key: rabbitmq-username
    - name: RABBITMQ_DEFAULT_PASS
      valueFrom:
        secretKeyRef:
          name: levoai-rabbitmq-auth
          key: rabbitmq-password
    - name: RABBITMQ_ERLANG_COOKIE
      valueFrom:
        secretKeyRef:
          name: levoai-rabbitmq-auth
          key: rabbitmq-erlang-cookie
  # NEW: Plugin setup configuration (uses same image as main container)
  pluginSetup:
    enabled: true
    plugins:
      - "rabbitmq_management"
    resources: {}
    securityContext: {}
  # REMOVE: The hardcoded initContainers section
  # initContainers: []
  configurationExistingSecret: ""
  configuration: |-
    loopback_users.guest = false
  # Install the per-queue byte-cap policy broker-side once the node is up. Applied
  # via a policy (not a queue arg) so it also covers already-declared queues without
  # a 406 PRECONDITION_FAILED on upgrade. Mirrors the docker-compose set_policy.
  # NOTE: setting lifecycleHooks replaces the bitnami default, so the default preStop
  # (rabbitmqctl stop_app) is repeated here to preserve graceful shutdown.
  lifecycleHooks:
    preStop:
      exec:
        command: ["/bin/bash", "-ec", "rabbitmqctl stop_app"]
    postStart:
      exec:
        command:
          - /bin/bash
          - -ec
          - |
            # Wait for the erlang cookie before invoking rabbitmqctl: this hook can run as
            # root before the entrypoint has written the cookie, and a premature rabbitmqctl
            # would create a root-owned .erlang.cookie the rabbitmq user can't read (eacces).
            until [ -s /var/lib/rabbitmq/.erlang.cookie ] || [ -s /bitnami/rabbitmq/.rabbitmq/.erlang.cookie ]; do sleep 1; done
            until rabbitmqctl await_startup >/dev/null 2>&1; do sleep 2; done
            until rabbitmqctl set_operator_policy levoai-storage-limits '.*' "{\"max-length-bytes\":${LEVOAI_RABBITMQ_MAX_QUEUE_SIZE_BYTES:-4294967296},\"overflow\":\"drop-head\"}" --apply-to queues --priority 1; do echo 'levoai: set_operator_policy failed; retrying in 5s'; sleep 5; done
            echo 'levoai: byte-cap policy installed'
  # Gate readiness on the broker running AND the byte-cap policy being installed: if
  # set_policy never succeeds the pod stays NotReady and dependents do not receive
  # traffic into byte-unbounded queues -- the primary safeguard. Mirrors the
  # docker-compose healthcheck. NOTE: deliberately NOT gated on check_local_alarms --
  # a disk/memory alarm is RabbitMQ's intended backpressure (block publishers) while
  # it stays up and consumers keep draining; marking the pod NotReady on an alarm
  # would cut off the drain path and turn backpressure into an outage.
  customReadinessProbe:
    exec:
      command:
        - /bin/bash
        - -ec
        - rabbitmq-diagnostics -q check_running && rabbitmqctl -q list_operator_policies | grep -q levoai-storage-limits
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 3
  auth:
    existingPasswordSecret: levoai-rabbitmq-auth
    existingErlangCookieSecret: levoai-rabbitmq-auth
    tls:
      autoGenerated: true
      enabled: true
      sslOptionsVerify: "verify_none"
      failIfNoPeerCert: false
  service:
    portEnabled: true
kafka:
  fullnameOverride: "levoai-kafka"
  # Override the kafka image to use bitnamilegacy
  image:
    registry: "docker.io"
    repository: "bitnamilegacy/kafka"
    tag: "3.5.0-debian-11-r21"
    pullPolicy: "IfNotPresent"
  # Kafka configuration for KRaft mode (no Zookeeper)
  kraft:
    enabled: true
  # Disable Zookeeper since we're using KRaft mode
  zookeeper:
    enabled: false
  # Number of Kafka nodes (single node for dev/test)
  replicaCount: 1
  # Listeners configuration
  listeners: []
  # Service configuration
  service:
    type: ClusterIP
    ports:
      client: 9092
  persistence:
    enabled: true
    size: 32Gi
satellite:
  fullnameOverride: "levoai-satellite"
  env: []
tagger:
  fullnameOverride: "levoai-tagger"
  env:
    - name: RUN_SEPARATE_PROCESSES
      value: "true"
testrunner:
  enabled: true
  fullnameOverride: "levoai-testrunner"
detection:
  enabled: false
